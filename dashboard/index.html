<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дашборд · Pro Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F4EFE7;
  --bg-2:#EAE3D5;
  --card:#FFFFFF;
  --line:rgba(20,15,10,.08);
  --text:#1A1512;
  --muted:#6B655B;
  --coral:#E86D5A;
  --gold:#D4A24A;
  --sea:#3A7AA8;
  --olive:#7A8A5A;
  --clay:#B8663D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.015em;min-height:100%}
body{background:radial-gradient(500px 400px at 100% 0%,rgba(232,109,90,.08),transparent 60%),var(--bg)}
#app{max-width:520px;margin:0 auto;padding:16px 14px 60px}
.serif{font-family:'Fraunces',serif}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:6px 4px}
.top-l{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);font-weight:800}
.brand{font-family:'Fraunces',serif;font-weight:800;font-size:17px;letter-spacing:-.03em}
.top-r{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--text)}

.hero{position:relative;height:380px;border-radius:24px;overflow:hidden;margin-bottom:12px;background:#0F3060}
.hero-img{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=900&auto=format&fit=crop&q=85') center/cover;filter:saturate(1.08)}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.7) 100%)}
.hero-top{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2;color:#fff}
.hero-tag{background:rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;letter-spacing:.05em;border:1px solid rgba(255,255,255,.3);text-transform:uppercase}
.hero-num{background:var(--coral);color:#fff;font-size:11px;font-weight:800;padding:6px 12px;border-radius:99px;letter-spacing:.02em}
.hero-num.down{background:var(--clay)}
.hero-num.down::before{content:"↓ "}
.hero-num.up::before{content:"↑ "}
.hero-body{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;color:#fff}
.hero-l{font-size:12px;font-weight:600;opacity:.9;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
.hero-v{font-family:'Fraunces',serif;font-size:64px;font-weight:800;line-height:.95;letter-spacing:-.04em;margin-bottom:4px}
.hero-v small{font-size:22px;font-weight:600;opacity:.7;margin-left:6px;font-family:'Inter',sans-serif;letter-spacing:0}
.hero-cap{font-family:'Fraunces',serif;font-style:italic;font-size:14px;opacity:.85;font-weight:400;line-height:1.35;margin-top:8px}

.qstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.qs{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px}
.qs-l{color:var(--muted);font-size:11px;font-weight:600;margin-bottom:4px}
.qs-v{font-family:'Fraunces',serif;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.qs-v small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px;font-family:'Inter',sans-serif;letter-spacing:0}
.qs-d{font-size:10px;color:var(--olive);font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.qs-d.d{color:var(--clay)}

.sec-hd{display:flex;justify-content:space-between;align-items:flex-end;margin:24px 4px 12px}
.sec-t{font-family:'Fraunces',serif;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sec-t em{font-style:italic;font-weight:600}
.sec-c{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}

.weekly-card{background:var(--card);border-radius:18px;padding:18px 18px 12px;border:1px solid var(--line);margin-bottom:12px}
.weekly-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.weekly-t{font-family:'Fraunces',serif;font-size:16px;font-weight:800;letter-spacing:-.02em}
.weekly-c{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px}
.br{flex:1;border-radius:8px 8px 4px 4px;transition:all .3s ease;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.br.a{background:linear-gradient(180deg,#C7A8FF,#9C7EE0)}
.br.b{background:linear-gradient(180deg,#66E0D0,#4DBAAC)}
.br.c{background:linear-gradient(180deg,#FF7A8A,#E8556A)}
.br.d{background:linear-gradient(180deg,var(--gold),var(--coral))}
.br::after{content:attr(data-v);position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-weight:800}
.bars-lbl{display:flex;gap:10px;margin-top:8px}
.bars-lbl div{flex:1;text-align:center;color:var(--muted);font-size:11px;font-weight:700}

.dirs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);margin-bottom:12px}
.dir{text-align:center}
.dir-photo{width:100%;aspect-ratio:1;border-radius:50%;background:var(--bg-2) center/cover no-repeat;margin-bottom:8px;border:2px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.dir-name{font-family:'Fraunces',serif;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.dir-pct{color:var(--muted);font-size:11px;font-weight:600;margin-top:2px}

.cli-row{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line);margin-bottom:8px;display:flex;align-items:center;gap:14px}
.cli-photo{width:60px;height:60px;border-radius:50%;background:var(--bg-2) center/cover no-repeat;flex-shrink:0;position:relative}
.cli-photo-flag{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cli-b{flex:1;min-width:0}
.cli-n{font-family:'Fraunces',serif;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:6px}
.cli-tag{background:var(--gold);color:#fff;font-size:9px;padding:2px 6px;border-radius:99px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.cli-m{color:var(--muted);font-size:12px;font-weight:500;margin-top:2px;line-height:1.3}
.cli-v{text-align:right}
.cli-vn{font-family:'Fraunces',serif;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--coral);line-height:1}
.cli-vn small{font-size:9px;color:var(--muted);font-weight:700;font-family:'Inter',sans-serif;letter-spacing:.08em;display:block;margin-top:2px;text-transform:uppercase}

.dep-list{display:flex;flex-direction:column;gap:10px}
.dep{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dep-row{display:flex;align-items:stretch;gap:0}
.dep-photo{width:110px;background:var(--bg-2) center/cover no-repeat;position:relative;flex-shrink:0}
.dep-date{position:absolute;top:10px;left:10px;background:var(--card);border-radius:10px;padding:6px 10px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.dep-day{font-family:'Fraunces',serif;font-size:18px;font-weight:800;line-height:1;letter-spacing:-.02em}
.dep-mo{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.dep-b{flex:1;padding:14px 14px 14px 16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.dep-n{font-family:'Fraunces',serif;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:4px}
.dep-l{color:var(--muted);font-size:12px;font-weight:500}
.dep-days{padding-right:16px;text-align:right;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;flex-shrink:0;min-width:60px}
.dep-days-n{font-family:'Fraunces',serif;font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--coral);line-height:1}
.dep-days-l{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

.foot{margin-top:20px;text-align:center;font-family:'Fraunces',serif;font-style:italic;color:var(--muted);font-size:12px}

.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.loading-spinner{width:36px;height:36px;border:3px solid rgba(232,109,90,.2);border-top-color:var(--coral);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ANIMATIONS */
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes barGrow{from{height:0}}
@keyframes progressFill{from{width:0}}
@keyframes ringDraw{from{stroke-dashoffset:200}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.hero{animation:slideUp .55s cubic-bezier(.34,.5,.24,1)}
.hero-v{animation:fadeIn .8s ease .3s both}
.hero-cap{animation:fadeIn .8s ease .55s both}
.hero-num{animation:pop .45s cubic-bezier(.34,1.56,.64,1) .35s both}
.hero-tag{animation:fadeIn .5s ease .2s both}
.month-tabs{animation:slideUp .45s ease .05s both}

.qs{opacity:0;animation:slideUp .5s cubic-bezier(.34,.5,.24,1) both}
.qs:nth-child(1){animation-delay:.15s}
.qs:nth-child(2){animation-delay:.22s}
.qs:nth-child(3){animation-delay:.29s}
.qs:nth-child(4){animation-delay:.36s}
.qs-v{animation:fadeIn .5s ease .3s both}

.weekly-card,.dirs,.cli-row,.dep{opacity:0;animation:slideUp .5s cubic-bezier(.34,.5,.24,1) both}
.weekly-card{animation-delay:.4s}
.dirs{animation-delay:.5s}
.cli-row:nth-child(1){animation-delay:.55s}
.cli-row:nth-child(2){animation-delay:.62s}
.cli-row:nth-child(3){animation-delay:.69s}
.dep:nth-child(1){animation-delay:.75s}
.dep:nth-child(2){animation-delay:.82s}
.dep:nth-child(3){animation-delay:.89s}

.br{animation:barGrow .8s cubic-bezier(.34,.5,.24,1) .5s both;transform-origin:bottom}

.dir{opacity:0;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.dir:nth-child(1){animation-delay:.55s}
.dir:nth-child(2){animation-delay:.62s}
.dir:nth-child(3){animation-delay:.69s}
.dir:nth-child(4){animation-delay:.76s}
.dir-photo{transition:transform .25s ease}
.dir:active .dir-photo{transform:scale(.92)}
.dir-photo:hover{animation:float 2s ease-in-out infinite}

.expense-bar-fill{animation:progressFill 1.2s cubic-bezier(.34,.5,.24,1) .6s both}

.sec-hd{opacity:0;animation:fadeIn .45s ease .5s both}

.cli-photo,.dep-photo{transition:transform .25s ease}
.cli-row:active .cli-photo{transform:scale(1.05)}
.dep:active .dep-photo{transform:scale(1.05)}
.cli-vn,.dep-days-n,.qs-v,.hero-v{font-variant-numeric:tabular-nums}

.refresh-btn{transition:transform .2s ease}
.mt{transition:all .18s ease}
.mt:active{transform:scale(.95)}

/* screen transition on month switch */
.screen-fade{animation:fadeIn .35s ease}

.month-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:0 -4px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.month-tabs::-webkit-scrollbar{display:none}
.mt{flex-shrink:0;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s ease;letter-spacing:-.005em}
.mt.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.mt.on-current{background:var(--coral);color:#fff;border-color:var(--coral)}
.refresh-btn{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .18s ease}
.refresh-btn:active{transform:scale(.95)}
.refresh-btn.spinning::before{content:"↻";animation:spin 1s linear infinite;display:inline-block}
.refresh-btn::before{content:"↻";font-size:14px}
</style></head>
<body>
<div id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    Читаю твою таблицу...
  </div>
</div>

<script>
const app = document.getElementById('app');
let state = { data: null, activeIdx: 0 };

function esc(s){ return String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function daysWord(n){ if(n===1) return 'день'; if(n>=2&&n<=4) return 'дня'; return 'дней'; }
function pickMonth(){ return state.data.months[state.activeIdx] || state.data.months[0]; }

// count up animation: animates innerHTML from 0 to target over duration
function animateNumber(el, targetText, duration=900){
  // Extract numeric part (K, M suffix supported), preserve rest
  const match = String(targetText).match(/(-?\d+(?:\.\d+)?)([^\d].*)?$/);
  if(!match) { el.textContent = targetText; return; }
  const target = parseFloat(match[1]);
  const suffix = match[2] || '';
  const start = performance.now();
  const abs = Math.abs(target);
  const decimals = (String(match[1]).split('.')[1] || '').length;
  function step(now){
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out-cubic
    const val = target * eased;
    el.textContent = val.toFixed(decimals) + suffix;
    if(t < 1) requestAnimationFrame(step);
    else el.textContent = match[1] + suffix;
  }
  requestAnimationFrame(step);
}

function animateAllNumbers(){
  // find all .qs-v .hero-v .cli-vn .dep-days-n .price-block-amount and count up
  document.querySelectorAll('[data-num]').forEach(el => {
    const txt = el.getAttribute('data-num');
    animateNumber(el, txt);
  });
}

function switchMonth(i){
  state.activeIdx = i;
  render();
}

function render(){
  const d = state.data;
  const m = pickMonth();
  const upDown = m.delta_pct >= 0 ? 'up' : 'down';
  const deltaStr = m.delta_label ? `${Math.abs(m.delta_pct)}% к ${m.delta_label}` : '';

  // Month tabs — from left (most recent) to right (older)
  const tabs = d.months.map((mo, i) => {
    const cls = i === state.activeIdx ? (mo.is_current ? 'mt on-current' : 'mt on') : 'mt';
    return `<div class="${cls}" onclick="switchMonth(${i})">${esc(mo.name_short)}${mo.year !== 2026 ? ` '${String(mo.year).slice(-2)}` : ''}</div>`;
  }).join('');
  const monthTabs = `<div class="month-tabs">${tabs}</div>`;

  let weeklyHtml = '';
  // Weekly only makes sense for current month (real-time bars)
  if(m.is_current && d.weekly && d.weekly.length){
    const maxV = Math.max(...d.weekly.map(x=>x.value), 1);
    const bars = d.weekly.map((w,i)=>{
      const h = Math.round(w.value/maxV*100);
      const cls = ['a','b','c','d'][i%4];
      const short = w.value >= 1000000 ? `${(w.value/1000000).toFixed(1)}M` : `${Math.round(w.value/1000)}K`;
      return `<div class="br ${cls}" style="height:${Math.max(h,5)}%" data-v="${short}"></div>`;
    }).join('');
    const lbls = d.weekly.map(w=>`<div>${esc(w.label)}</div>`).join('');
    weeklyHtml = `
    <div class="weekly-card">
      <div class="weekly-hd"><div class="weekly-t">Выручка по неделям</div><div class="weekly-c">${esc(m.name_short)}</div></div>
      <div class="bars">${bars}</div>
      <div class="bars-lbl">${lbls}</div>
    </div>`;
  }

  const dirs = (d.directions||[]).map(dr => `
    <div class="dir">
      <div class="dir-photo" style="background-image:url('${dr.photo}')"></div>
      <div class="dir-name">${esc(dr.name)}</div>
      <div class="dir-pct">${dr.pct}%</div>
    </div>`).join('');

  const cli = (d.top_clients||[]).map(c => `
    <div class="cli-row">
      <div class="cli-photo" style="background-image:url('${c.photo}')"><div class="cli-photo-flag">${c.flag||'✈️'}</div></div>
      <div class="cli-b">
        <div class="cli-n">${esc(c.name)}${c.vip?' <span class="cli-tag">VIP</span>':''}</div>
        <div class="cli-m">${esc(c.meta||'')}</div>
      </div>
      <div class="cli-v"><div class="cli-vn">${(c.ltv/1000000).toFixed(2)}M<small>LTV</small></div></div>
    </div>`).join('');

  const dep = (d.departures||[]).map(x => `
    <div class="dep">
      <div class="dep-row">
        <div class="dep-photo" style="background-image:url('${x.photo}')">
          <div class="dep-date"><div class="dep-day">${esc(x.day)}</div><div class="dep-mo">${esc(x.mo)}</div></div>
        </div>
        <div class="dep-b"><div class="dep-n">${esc(x.name)}</div><div class="dep-l">${esc(x.loc)}</div></div>
        <div class="dep-days"><div class="dep-days-n">${x.days}</div><div class="dep-days-l">${daysWord(x.days)}</div></div>
      </div>
    </div>`).join('');

  const shouldAnimateNumbers = state._firstRender !== false;
  state._firstRender = false;
  app.innerHTML = `
    <div class="top">
      <div class="top-l"><div class="logo">P</div><div class="brand">Pro Travel</div></div>
      <button class="refresh-btn" onclick="refresh()">Обновить</button>
    </div>

    ${monthTabs}

    <div class="hero">
      <div class="hero-img"></div>
      <div class="hero-top">
        <div class="hero-tag">${m.is_current ? 'Идёт месяц' : 'Итог месяца'}</div>
        ${deltaStr ? `<div class="hero-num ${upDown}">${deltaStr}</div>` : ''}
      </div>
      <div class="hero-body">
        <div class="hero-l">приход (от клиентов)</div>
        <div class="hero-v"><span data-num="${esc(m.revenue_fmt)}">${esc(m.revenue_fmt)}</span><small>₽</small></div>
      </div>
    </div>

    <div class="qstats" style="grid-template-columns:1fr 1fr">
      <div class="qs"><div class="qs-l">мой доход</div><div class="qs-v" style="color:${m.gross_profit<0?'var(--clay)':'var(--olive)'}">${m.gross_profit<0?'-':''}<span data-num="${esc(m.gross_profit_fmt.replace('-',''))}">${esc(m.gross_profit_fmt.replace('-',''))}</span><small>₽</small></div><div class="qs-d">приход − ТО − банк</div></div>
      <div class="qs"><div class="qs-l">после расх. ИП</div><div class="qs-v" style="color:${m.net_before_tax<0?'var(--clay)':'var(--olive)'}">${m.net_before_tax<0?'-':''}<span data-num="${esc(m.net_before_tax_fmt.replace('-',''))}">${esc(m.net_before_tax_fmt.replace('-',''))}</span><small>₽</small></div><div class="qs-d">минус обслуживание</div></div>
      <div class="qs"><div class="qs-l">налог УСН 3%</div><div class="qs-v" style="color:var(--sea)"><span data-num="${esc(m.tax_fmt)}">${esc(m.tax_fmt)}</span><small>₽</small></div><div class="qs-d">с прихода</div></div>
      <div class="qs"><div class="qs-l">на руки</div><div class="qs-v" style="color:${m.net_after_tax<0?'var(--clay)':'var(--olive)'}">${m.net_after_tax<0?'-':''}<span data-num="${esc(m.net_after_tax_fmt.replace('-',''))}">${esc(m.net_after_tax_fmt.replace('-',''))}</span><small>₽</small></div><div class="qs-d ${m.net_after_tax<0?'d':''}">${m.margin_pct}% маржа</div></div>
    </div>

    ${m.expenses > 0 ? `
    <div class="weekly-card">
      <div class="weekly-hd"><div class="weekly-t">Затраты — куда</div><div class="weekly-c">${esc(m.name_short)}</div></div>
      <div style="display:flex;flex-direction:column;gap:10px;padding:4px 0 4px">
        ${[
          {label:'Оплата туроператору', val:m.operator_pay, color:'#E86D5A'},
          {label:'Обслуживание ИП', val:m.ie_overhead, color:'#D4A24A'},
          {label:'Комиссия банка', val:m.bank_comm, color:'#7A8A5A'},
          {label:'Прочее', val:m.other_exp, color:'#B8663D'},
        ].filter(x=>x.val>0).map(x => {
          const pct = Math.round(x.val / m.expenses * 100);
          const fmt = x.val >= 1000000 ? (x.val/1000000).toFixed(2)+'M' : Math.round(x.val/1000)+'K';
          return `
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
              <span style="font-weight:600">${x.label}</span>
              <span style="font-family:'Fraunces',serif;font-weight:700"><span style="color:var(--text)">${fmt} ₽</span> <span style="color:var(--muted);font-size:11px">${pct}%</span></span>
            </div>
            <div style="height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${x.color};border-radius:99px"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    ${m.top_operator ? `
    <div class="weekly-card">
      <div class="weekly-hd"><div class="weekly-t">Топ туроператор ${esc(m.name_short)}</div><div class="weekly-c">по приходам</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px">
        <div>
          <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:800;letter-spacing:-.02em">${esc(m.top_operator.name)}</div>
          ${m.top_tour ? `<div style="font-size:12px;color:var(--muted);font-weight:500;margin-top:4px">крупнейшая заявка: <b style="color:var(--text)">${esc(m.top_tour.num)}</b></div>` : ''}
        </div>
        <div style="font-family:'Fraunces',serif;font-size:28px;font-weight:800;color:var(--coral)">${m.top_operator.amount >= 1000000 ? (m.top_operator.amount/1000000).toFixed(2)+'M' : Math.round(m.top_operator.amount/1000)+'K'}<small style="font-size:12px;color:var(--muted);font-weight:600;font-family:'Inter',sans-serif;margin-left:2px">₽</small></div>
      </div>
    </div>` : ''}

    ${weeklyHtml}

    <div class="sec-hd">
      <div class="sec-t"><em>Куда</em> возишь</div>
      <div class="sec-c">${esc(m.name_short)}</div>
    </div>
    <div class="dirs">${dirs}</div>

    <div class="sec-hd">
      <div class="sec-t">Топ <em>клиенты</em></div>
      <div class="sec-c">LTV · всё время</div>
    </div>
    ${cli}

    <div class="sec-hd">
      <div class="sec-t">Скоро <em>в путь</em></div>
      <div class="sec-c">${d.departures.length} клиента</div>
    </div>
    <div class="dep-list">${dep}</div>

    <div class="foot">обновлено ${esc(d.as_of)} · ${esc(d.source_note)}</div>
  `;
  if(shouldAnimateNumbers) requestAnimationFrame(animateAllNumbers);
}

async function load(){
  try {
    const r = await fetch(`data.json?t=${Date.now()}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    state.data = d;
    state.activeIdx = d.active_month_idx || 0;
    render();
  } catch(e){
    app.innerHTML = `<div class="loading">Не смогла загрузить данные. Попробуй ещё раз через минуту.<br><br><small>${e.message}</small></div>`;
  }
}

async function refresh(){
  const btn = document.querySelector('.refresh-btn');
  if(btn) btn.classList.add('spinning');
  const prevIdx = state.activeIdx;
  await load();
  state.activeIdx = prevIdx < (state.data.months?.length || 1) ? prevIdx : 0;
  render();
  const btn2 = document.querySelector('.refresh-btn');
  if(btn2) btn2.classList.remove('spinning');
}

document.addEventListener('DOMContentLoaded', () => {
  const tg = window.Telegram?.WebApp;
  if(tg){ tg.expand(); tg.ready(); tg.setBackgroundColor('#F4EFE7'); tg.setHeaderColor('#F4EFE7'); }
  load();
});
</script>
</body></html>
